<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Logger</title>
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface-1: #fcfcfb;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --c-moist:   #2a78d6;   /* slot 1 blue    */
    --c-temp:    #008300;   /* slot 2 green   */
    --c-light:   #e87ba4;   /* slot 3 magenta */
    --c-batt:    #eda100;   /* slot 4 yellow  */
    --c-rssi:    #1baf7a;   /* slot 5 aqua    */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface-1: #1a1a19;
      --text-1:    #ffffff;
      --text-2:    #c3c2b7;
      --muted:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --c-moist:   #3987e5;
      --c-temp:    #008300;
      --c-light:   #d55181;
      --c-batt:    #c98500;
      --c-rssi:    #199e70;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text-1);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0; font-weight: 650; }
  #updated { color: var(--muted); font-size: 12.5px; }
  .ranges { margin-left: auto; display: flex; gap: 4px; }
  .ranges button { font: inherit; font-size: 12.5px; padding: 6px 12px; cursor: pointer;
    background: transparent; color: var(--text-2); border: 1px solid var(--border); border-radius: 7px; }
  .ranges button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-1);
    font-weight: 650; border-color: var(--baseline); }

  section.device { background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px 6px; margin-bottom: 12px; }
  .dev-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
    margin-bottom: 6px; position: relative; padding-right: 92px; }
  .add-note { position: absolute; right: 0; top: -3px; cursor: pointer; color: var(--text-2);
    border: 1px solid var(--border); background: transparent; font: inherit; font-size: 12.5px;
    border-radius: 7px; padding: 5px 11px; }
  .add-note:hover { border-color: var(--baseline); color: var(--text-1); }
  .dev-name { font-size: 15px; font-weight: 650; cursor: pointer; border-radius: 5px; padding: 1px 4px; margin-left: -4px; }
  .dev-name:hover { background: var(--page); }
  .dev-name .pencil { font-size: 11px; color: var(--muted); visibility: hidden; }
  .dev-name:hover .pencil { visibility: visible; }
  .dev-meta { color: var(--muted); font-size: 12px; }
  .dev-meta .warn { color: var(--text-2); font-weight: 600; }

  .metric { display: grid; grid-template-columns: 150px 1fr 170px;
    grid-template-areas: "lab val spark"; align-items: center;
    gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--grid); cursor: pointer; }
  .metric:hover { background: color-mix(in srgb, var(--page) 55%, transparent); }
  .metric .lab { grid-area: lab; display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-2); }
  .metric .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .metric .val { grid-area: val; font-size: 17px; font-weight: 650; text-align: left; }
  .metric .val small { font-size: 12px; font-weight: 400; color: var(--text-2); }
  .metric .spark { grid-area: spark; justify-self: end; width: 100%; max-width: 170px; }
  .metric .spark svg { width: 100%; height: auto; display: block; }
  .expand { border-top: 1px solid var(--grid); padding: 10px 0; position: relative; }

  svg { display: block; }
  .tooltip { position: absolute; pointer-events: none; display: none; z-index: 3;
    background: var(--surface-1); border: 1px solid var(--baseline); border-radius: 7px;
    padding: 5px 9px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.13); white-space: nowrap; }
  .tooltip b { font-size: 13px; }
  .tooltip .tt-t { color: var(--muted); }

  .events { border-top: 1px solid var(--grid); padding: 8px 0 10px; }
  .events .ev-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .ev-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0 0 2px; font-size: 13px; }
  .ev-row .ev-t { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .ev-row .ev-x { cursor: pointer; color: var(--muted); visibility: hidden; border: none;
    background: none; font-size: 13px; padding: 0 4px; }
  .ev-row:hover .ev-x { visibility: visible; }
  .ev-row .ev-x:hover { color: var(--text-1); }
  .ev-more { color: var(--muted); font-size: 12px; cursor: pointer; padding-top: 2px; }

  dialog#noteModal { background: var(--surface-1); color: var(--text-1);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    width: min(92vw, 26em); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  dialog#noteModal::backdrop { background: rgba(0,0,0,.35); }
  dialog#noteModal h2 { margin: 0 0 10px; font-size: 14px; font-weight: 650; }
  dialog#noteModal textarea { font: inherit; width: 100%; resize: vertical;
    background: var(--page); color: var(--text-1); border: 1px solid var(--baseline);
    border-radius: 7px; padding: 7px 9px; min-height: 3.2em; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .modal-actions button { font: inherit; font-size: 13px; cursor: pointer; border-radius: 7px;
    padding: 7px 14px; border: 1px solid var(--border); background: transparent; color: var(--text-2); }
  .modal-actions button.primary { background: var(--text-1); color: var(--page);
    border-color: var(--text-1); font-weight: 650; }
  details.table { margin-top: 16px; }
  details.table summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; background: var(--surface-1);
    border: 1px solid var(--border); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--text-2); font-weight: 600; }
  #empty { color: var(--muted); padding: 30px 0; text-align: center; display: none; }

  /* touch devices: no hover, so keep affordances visible */
  @media (hover: none) {
    .ev-row .ev-x, .dev-name .pencil { visibility: visible; }
  }
  /* narrow screens: label above value, sparkline to the right of both */
  @media (max-width: 640px) {
    .wrap { padding: 12px 10px 32px; }
    section.device { padding: 12px 12px 4px; border-radius: 10px; }
    .metric { grid-template-columns: minmax(0, 1fr) 128px;
      grid-template-areas: "lab spark" "val spark"; }
    .metric .spark { grid-row: span 2; align-self: center; max-width: 128px; }
    .metric .val { font-size: 16px; }
    header { gap: 6px; }
    .ranges { margin-left: 0; width: 100%; }
    .ranges button { flex: 1; }
    th, td { padding: 5px 7px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌱 Plant Logger</h1>
    <span id="updated">loading…</span>
    <nav class="ranges" aria-label="Time range">
      <button data-h="24">24h</button>
      <button data-h="168" aria-pressed="true">7d</button>
      <button data-h="720">30d</button>
      <button data-h="0">All</button>
    </nav>
  </header>

  <div id="devices"></div>
  <div id="empty">No readings yet — waiting for sensors to phone home.</div>

  <details class="table">
    <summary>Data table (most recent 100)</summary>
    <div id="tableWrap" style="overflow-x:auto"></div>
  </details>
</div>

<dialog id="noteModal">
  <h2 id="noteModalTitle">Add note</h2>
  <textarea id="noteText" rows="3" placeholder="e.g. watered with 3 cups"></textarea>
  <div class="modal-actions">
    <button type="button" id="noteCancel">Cancel</button>
    <button type="button" class="primary" id="noteSave">Save</button>
  </div>
</dialog>

<script>
"use strict";
const METRICS = [
  { key: "soil_moist", name: "Soil moisture", unit: "", varName: "--c-moist",
    fmt: v => Math.round(v), sub: v => v < 400 ? "dry" : v < 800 ? "ok" : "wet",
    guides: [{ y: 400, label: "dry" }, { y: 800, label: "wet" }] },
  { key: "soil_temp", name: "Soil temp", unit: "°C", varName: "--c-temp", fmt: v => v.toFixed(1) },
  { key: "amb_light", name: "Ambient light", unit: "", varName: "--c-light", fmt: v => Math.round(v) },
  { key: "batt_pct", name: "Battery", unit: "%", varName: "--c-batt", fmt: v => v.toFixed(0) },
  { key: "rssi", name: "Wi-Fi signal", unit: "dBm", varName: "--c-rssi", fmt: v => v.toFixed(0) },
];
let hours = 168, rows = [], devices = [], events = [];
const expanded = new Set();
const showAllEvents = new Set();

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtTime = t => {
  const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? hm
    : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + hm;
};
const ago = t => {
  const s = Date.now() / 1000 - t;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
};

async function load() {
  try {
    const [dr, rr, er] = await Promise.all([fetch("/api/devices"),
      fetch("/api/data?hours=" + hours), fetch("/api/events?hours=" + hours)]);
    devices = (await dr.json()).devices || [];
    rows = (await rr.json()).rows || [];
    events = (await er.json()).events || [];
  } catch (e) { devices = []; rows = []; events = []; }
  render();
}

function render() {
  document.getElementById("empty").style.display = devices.length ? "none" : "block";
  renderDevices(); renderTable();
  const last = Math.max(0, ...devices.map(d => d.ts));
  document.getElementById("updated").textContent = devices.length
    ? "last reading " + fmtTime(last) + " · " + rows.length + " readings shown" : "";
}

function devLabel(d) { return d.name || "sensor " + d.device.slice(-4); }

function renderDevices() {
  const holder = document.getElementById("devices");
  holder.innerHTML = "";
  for (const dev of devices) {
    const devRows = rows.filter(r => r.device === dev.device);
    const sec = document.createElement("section");
    sec.className = "device";
    const stale = Date.now() / 1000 - dev.ts > 2.2 * 3600;
    const head = document.createElement("div");
    head.className = "dev-head";
    head.innerHTML =
      '<span class="dev-name" title="Click to rename">' + devLabel(dev) +
      ' <span class="pencil">✎</span></span>' +
      '<span class="dev-meta' + '">' + (stale ? '<span class="warn">⚠ last seen ' : "last seen ") +
      ago(dev.ts) + (stale ? "</span>" : "") +
      (dev.vbus ? " · USB power" : " · on battery") +
      " · id " + dev.device + "</span>";
    const noteBtn = document.createElement("button");
    noteBtn.className = "add-note";
    noteBtn.textContent = "+ note";
    head.appendChild(noteBtn);
    head.querySelector(".dev-name").addEventListener("click", ev => {
      ev.stopPropagation();
      const span = ev.currentTarget;
      if (span.querySelector("input")) return;
      const input = document.createElement("input");
      input.value = dev.name || "";
      input.placeholder = "sensor " + dev.device.slice(-4);
      input.style.cssText = "font:inherit;width:14em;background:var(--page);color:var(--text-1);" +
        "border:1px solid var(--baseline);border-radius:5px;padding:1px 5px;";
      span.textContent = "";
      span.appendChild(input);
      input.focus();
      const done = async save => {
        if (save) {
          await fetch("/api/name", { method: "POST",
            body: JSON.stringify({ device: dev.device, name: input.value.trim() }) });
        }
        load();
      };
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") done(true);
        else if (e.key === "Escape") done(false);
      });
      input.addEventListener("blur", () => done(false));
    });
    sec.appendChild(head);

    const devEvents = events.filter(e => e.device === dev.device);
    for (const m of METRICS) {
      const pts = devRows.filter(r => r[m.key] != null).map(r => ({ t: r.ts, v: r[m.key] }));
      if (!pts.length && dev[m.key] == null) continue;
      const cur = pts.length ? pts[pts.length - 1].v : dev[m.key];
      const rowEl = document.createElement("div");
      rowEl.className = "metric";
      const id = dev.device + "|" + m.key;
      let sub = m.sub && cur != null ? " · " + m.sub(cur) : "";
      if (m.key === "batt_pct" && dev.batt_v != null) sub = " · " + dev.batt_v.toFixed(2) + " V";
      rowEl.innerHTML =
        '<span class="lab"><span class="dot" style="background:var(' + m.varName + ')"></span>' + m.name + "</span>" +
        '<span class="val">' + (cur == null ? "–" : m.fmt(cur)) + "<small>" +
        (m.unit ? " " + m.unit : "") + sub + "</small></span>" +
        '<span class="spark"></span>';
      rowEl.querySelector(".spark").appendChild(sparkline(pts, css(m.varName), devEvents));
      rowEl.addEventListener("click", () => {
        expanded.has(id) ? expanded.delete(id) : expanded.add(id);
        renderDevices();
      });
      rowEl.setAttribute("title", "Click for full chart");
      sec.appendChild(rowEl);
      if (expanded.has(id)) {
        const ex = document.createElement("div");
        ex.className = "expand";
        ex.appendChild(bigChart(m, pts, devEvents));
        sec.appendChild(ex);
      }
    }
    const evBox = eventSection(dev, devEvents);
    noteBtn.addEventListener("click", () => openNoteModal(dev));
    sec.appendChild(evBox);
    holder.appendChild(sec);
  }
}

function eventSection(dev, devEvents) {
  const box = document.createElement("div");
  box.className = "events";
  const head = document.createElement("div");
  head.className = "ev-head";
  head.innerHTML = "<span>Notes</span>";
  box.appendChild(head);

  const list = devEvents.slice().reverse();
  const cap = showAllEvents.has(dev.device) ? list.length : 3;
  for (const ev of list.slice(0, cap)) {
    const row = document.createElement("div");
    row.className = "ev-row";
    row.innerHTML = '<span class="ev-t">' + fmtTime(ev.ts) + "</span><span></span>" +
      '<button class="ev-x" title="Delete note">✕</button>';
    row.children[1].textContent = ev.text;
    row.querySelector(".ev-x").addEventListener("click", async () => {
      await fetch("/api/event_delete", { method: "POST", body: JSON.stringify({ id: ev.id }) });
      load();
    });
    box.appendChild(row);
  }
  if (list.length > 3 && !showAllEvents.has(dev.device)) {
    const more = document.createElement("div");
    more.className = "ev-more";
    more.textContent = "show all " + list.length + " notes";
    more.addEventListener("click", () => { showAllEvents.add(dev.device); renderDevices(); });
    box.appendChild(more);
  }
  return box;
}

function sparkline(pts, color, devEvents) {
  const W = 160, H = 34;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  if (!pts.length) return svg;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  let marks = "";
  for (const ev of devEvents || []) {
    if (ev.ts >= t0 && ev.ts <= t1) {
      const ex = t1 === t0 ? W / 2 : 2 + (ev.ts - t0) / (t1 - t0) * (W - 8);
      marks += '<line x1="' + ex.toFixed(1) + '" x2="' + ex.toFixed(1) + '" y1="1" y2="' + (H - 1) +
               '" stroke="var(--baseline)" stroke-width="1" stroke-dasharray="2 3"/>';
    }
  }
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const x = t => t1 === t0 ? W / 2 : 2 + (t - t0) / (t1 - t0) * (W - 8);
  const y = v => 2 + (1 - (v - lo) / (hi - lo)) * (H - 4);
  let inner = "";
  if (pts.length > 1) {
    const d = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    inner += '<path d="' + d + " L" + x(t1).toFixed(1) + " " + (H - 1) + " L" + x(t0).toFixed(1) + " " + (H - 1) +
             ' Z" fill="' + color + '" opacity="0.10"/>';
    inner += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"/>';
  }
  const lastP = pts[pts.length - 1];
  inner += '<circle cx="' + x(lastP.t) + '" cy="' + y(lastP.v) + '" r="2.6" fill="' + color + '"/>';
  svg.innerHTML = marks + inner;
  return svg;
}

function bigChart(m, pts, devEvents) {
  const holder = document.createElement("div");
  holder.style.position = "relative";
  const avail = (document.querySelector(".wrap").clientWidth || 800) - 32;
  const W = Math.max(300, Math.min(760, avail)), H = 200, L = 46, R = 14, T = 12, B = 26;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", m.name);
  svg.style.width = "100%";
  holder.appendChild(svg);
  if (!pts.length) return holder;
  const evs = devEvents || [];
  const t0 = Math.min(pts[0].t, ...evs.map(e => e.ts));
  let t1 = Math.max(pts[pts.length - 1].t, ...evs.map(e => e.ts));
  if (t1 === t0) t1 = t0 + 1;
  let vMin = Math.min(...pts.map(p => p.v)), vMax = Math.max(...pts.map(p => p.v));
  for (const g of m.guides || []) { vMin = Math.min(vMin, g.y); vMax = Math.max(vMax, g.y); }
  if (vMin === vMax) { vMin -= 1; vMax += 1; }
  const pad = (vMax - vMin) * 0.08; vMin -= pad; vMax += pad;
  const x = t => t1 === t0 ? (L + W - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - vMin) / (vMax - vMin)) * (H - T - B);
  const color = css(m.varName);
  let inner = "";
  for (const tv of niceTicks(vMin, vMax, 4)) {
    inner += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(tv) + '" y2="' + y(tv) + '" stroke="var(--grid)"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(tv) + 3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + shortNum(tv) + "</text>";
  }
  const xt = pts.length > 2 ? [pts[0].t, pts[Math.floor(pts.length / 2)].t, pts[pts.length - 1].t] : [pts[0].t];
  const placed = [];
  for (const tv of new Set(xt)) {
    const px = x(tv);
    if (placed.some(p => Math.abs(p - px) < 80)) continue;
    placed.push(px);
    inner += '<text x="' + px + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + fmtTime(tv) + "</text>";
  }
  for (const g of m.guides || []) {
    inner += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g.y) + '" y2="' + y(g.y) +
      '" stroke="var(--baseline)" stroke-dasharray="3 4"/>' +
      '<text x="' + (W - R) + '" y="' + (y(g.y) - 3) + '" text-anchor="end" font-size="9" fill="var(--muted)">' + g.label + "</text>";
  }
  for (const ev of evs) {
    const ex = x(ev.ts);
    inner += '<line x1="' + ex.toFixed(1) + '" x2="' + ex.toFixed(1) + '" y1="' + T + '" y2="' + (H - B) +
             '" stroke="var(--baseline)" stroke-width="1" stroke-dasharray="3 4"/>' +
             '<path d="M' + (ex - 4).toFixed(1) + " " + T + " L" + (ex + 4).toFixed(1) + " " + T +
             " L" + ex.toFixed(1) + " " + (T + 6) + ' Z" fill="var(--muted)"/>';
  }
  const pLast = pts[pts.length - 1].t, pFirst = pts[0].t;
  const lineD = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  inner += '<path d="' + lineD + " L" + x(pLast).toFixed(1) + " " + (H - B) + " L" + x(pFirst).toFixed(1) + " " + (H - B) +
           ' Z" fill="' + color + '" opacity="0.10"/>';
  inner += '<path d="' + lineD + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if (pts.length <= 3) for (const p of pts)
    inner += '<circle cx="' + x(p.t) + '" cy="' + y(p.v) + '" r="4" fill="' + color + '" stroke="var(--surface-1)" stroke-width="2"/>';
  inner += '<circle class="hoverdot" r="4.5" fill="' + color + '" stroke="var(--surface-1)" stroke-width="2" style="display:none"/>';
  inner += '<line class="crosshair" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--baseline)" style="display:none"/>';
  svg.innerHTML = inner;

  const tip = document.createElement("div");
  tip.className = "tooltip";
  holder.appendChild(tip);
  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const mx = (ev.clientX - box.left) / box.width * W;
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const d = Math.abs(x(p.t) - mx); if (d < bd) { bd = d; best = p; } }
    const dot = svg.querySelector(".hoverdot"), ch = svg.querySelector(".crosshair");
    dot.style.display = ch.style.display = "";
    dot.setAttribute("cx", x(best.t)); dot.setAttribute("cy", y(best.v));
    ch.setAttribute("x1", x(best.t)); ch.setAttribute("x2", x(best.t));
    let evNear = null, evd = 12;
    for (const ev of evs) { const d = Math.abs(x(ev.ts) - mx); if (d < evd) { evd = d; evNear = ev; } }
    tip.style.display = "block";
    tip.innerHTML = "<b>" + m.fmt(best.v) + (m.unit ? " " + m.unit : "") + "</b> <span class='tt-t'>" + fmtTime(best.t) + "</span>" +
      (evNear ? '<div style="max-width:22em;white-space:normal">📌 <span class="tt-t">' + fmtTime(evNear.ts) + "</span> " +
        evNear.text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</div>" : "");
    const px = x(best.t) / W * box.width;
    tip.style.left = Math.min(px + 12, box.width - tip.offsetWidth - 4) + "px";
    tip.style.top = (y(best.v) / H * box.height - 34) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    svg.querySelector(".hoverdot").style.display = svg.querySelector(".crosshair").style.display = "none";
  });
  holder.addEventListener("click", ev => ev.stopPropagation());
  return holder;
}

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n + 1) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const shortNum = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k" : "" + +v.toFixed(2);

function renderTable() {
  const nameOf = {};
  for (const d of devices) nameOf[d.device] = devLabel(d);
  const cols = [["ts", "time"], ["device", "sensor"], ["soil_moist", "moisture"], ["soil_temp", "soil °C"],
                ["amb_light", "light"], ["batt_v", "batt V"], ["batt_pct", "batt %"], ["rssi", "RSSI"], ["vbus", "USB"]];
  const recent = rows.slice(-100).reverse();
  let h = "<table><thead><tr>" + cols.map(c => "<th>" + c[1] + "</th>").join("") + "</tr></thead><tbody>";
  for (const r of recent) {
    h += "<tr>" + cols.map(([k]) => {
      let v = r[k];
      if (k === "ts") v = fmtTime(v);
      else if (k === "device") v = nameOf[v] || v;
      else if (k === "vbus") v = v ? "✓" : "";
      else if (v == null) v = "–";
      else if (typeof v === "number") v = +v.toFixed(2);
      return "<td>" + v + "</td>";
    }).join("") + "</tr>";
  }
  document.getElementById("tableWrap").innerHTML = h + "</tbody></table>";
}

const noteModal = document.getElementById("noteModal");
let noteDevice = null;
function openNoteModal(dev) {
  noteDevice = dev.device;
  document.getElementById("noteModalTitle").textContent = "Add note — " + devLabel(dev);
  const ta = document.getElementById("noteText");
  ta.value = "";
  noteModal.showModal();
  ta.focus();
}
async function saveNote() {
  const text = document.getElementById("noteText").value.trim();
  noteModal.close();
  if (!text || !noteDevice) return;
  await fetch("/api/event", { method: "POST",
    body: JSON.stringify({ device: noteDevice, text }) });
  load();
}
document.getElementById("noteSave").addEventListener("click", saveNote);
document.getElementById("noteCancel").addEventListener("click", () => noteModal.close());
document.getElementById("noteText").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); }
});
noteModal.addEventListener("click", e => { if (e.target === noteModal) noteModal.close(); });

document.querySelector(".ranges").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  document.querySelectorAll(".ranges button").forEach(x => x.setAttribute("aria-pressed", x === b));
  hours = +b.dataset.h;
  load();
});
load();
setInterval(load, 5 * 60 * 1000);
let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    // skip re-render while typing (mobile keyboard fires resize) — it would destroy the field
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
    renderDevices();
  }, 200);
});
</script>

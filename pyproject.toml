[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dustycam"
version = "0.0.1"
authors = [
  { name="OwlMoshPit", email="owlmoshpit@proton.me" },
]
description = "A smart camera for the people by the people."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "requests",
    "opencv-contrib-python",
    "ultralytics",
    "pytest>=9.0.1",
    # CPU-only PyTorch for Linux (Python 3.12)
    "torch==2.5.1+cpu",
    # Fallbacks / Standard Deps
    "torch ; sys_platform != 'linux'",
    "torchvision",
    "torchaudio",
]

[project.optional-dependencies]
pi = [
    "picamera2",
]


[project.urls]
Homepage = "https://www.dustycam.com"

[tool.setuptools.packages.find]
# Each camera under cameras/ owns its software package.
where = ["cameras/pi5cam/software"]
include = ["pi5cam*"]
exclude = ["data*"]
# Required: pyproject's find defaults to namespaces=true, which would otherwise
# sweep up non-package dirs (scripts/, assets/) as namespace packages.
namespaces = false




